services:
  app:
    image: ghcr.io/doanvuduy170921/nines-shop:latest
    container_name: nineshop-api
    restart: always
    ports:
      - "8081:8080"
    env_file:
      - .env
    depends_on:
      - postgres-db
      - redis-server
      - rabbitmq-server
    networks:
      - nineshop-net

  frontend:
    image: ghcr.io/doanvuduy170921/nines-shop-ui:latest
    container_name: nineshop-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - nineshop-net

  postgres-db:
    image: postgres:15-alpine
    container_name: nineshop-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # No "ports:" here on purpose: Postgres only needs to be reachable from
    # other containers on nineshop-net, never from the internet. If you need
    # to inspect it from your own machine, use:
    #   ssh -L 5432:localhost:5432 <vps-user>@<vps-ip>
    # then connect to localhost:5432 through the tunnel instead of opening
    # the port publicly.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nineshop-net

  redis-server:
    image: redis:alpine
    container_name: nineshop-redis
    restart: always
    # Same reasoning as Postgres: no public port.
    volumes:
      - redisdata:/data
    networks:
      - nineshop-net

  rabbitmq-server:
    image: rabbitmq:3-management-alpine
    container_name: nineshop-rabbitmq
    restart: always
    # Same reasoning again. If you need the 15672 management UI, tunnel to it
    # with SSH port-forwarding rather than exposing it publicly.
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - nineshop-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  rabbitmqdata:
    driver: local

networks:
  nineshop-net:
    driver: bridge